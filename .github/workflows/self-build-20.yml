name: Self Build API 896686 Test

on:
  workflow_dispatch:
    inputs:
      use_source_api:
        description: Test the API configuration verified in the original Nagram release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Check build configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          USE_SOURCE_API: ${{ inputs.use_source_api }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          for name in ('LOCAL_PROPERTIES', 'KEYSTORE_BASE64'):
              value = os.environ.get(name, '').strip()
              if not value:
                  raise SystemExit(f'Add the Actions secret: {name}')
              try:
                  decoded = base64.b64decode(value, validate=True)
              except Exception:
                  raise SystemExit(f'{name} must contain single-line base64')
              if not decoded:
                  raise SystemExit(f'{name} is empty')
          text = base64.b64decode(os.environ['LOCAL_PROPERTIES'].strip()).decode('utf-8')
          properties = dict(line.split('=', 1) for line in text.splitlines() if '=' in line and not line.lstrip().startswith('#'))
          properties = {key.strip(): value.strip() for key, value in properties.items()}
          for key in ('KEYSTORE_PASS', 'ALIAS_NAME', 'ALIAS_PASS'):
              if not properties.get(key):
                  raise SystemExit(f'LOCAL_PROPERTIES is missing: {key}')
          app_id = properties.get('TELEGRAM_APP_ID', '')
          app_hash = properties.get('TELEGRAM_APP_HASH', '')
          if bool(app_id) != bool(app_hash):
              raise SystemExit('Provide both TELEGRAM_APP_ID and TELEGRAM_APP_HASH, or omit both.')
          if app_id and app_id != '896686':
              raise SystemExit('This test requires the verified API 896686 configuration; use signing-only LOCAL_PROPERTIES.')
          if app_hash and app_hash != 'cfa1494541244ed94cbb742712b0dc37':
              raise SystemExit('This test requires the matching verified API hash; use signing-only LOCAL_PROPERTIES.')
          if not app_id:
              if os.environ.get('USE_SOURCE_API', '').lower() != 'true':
                  raise SystemExit('Add your Telegram API credentials, or explicitly select the source API option when starting this workflow.')
              print('Using the verified release API 896686 for a fresh isolated login test.')
          print('Build configuration is present.')
          PY

  native:
    name: Native build (${{ matrix.abi }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare native code for own signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('TMessagesProj/jni/jni.c')
          text = path.read_text()
          # The upstream README requires removing its signing check for self builds.
          pattern = r'\s*if\s*\(verifySign\(env\)\s*!=\s*JNI_OK\)\s*\{\s*return\s+JNI_ERR;\s*\}'
          text, count = re.subn(pattern, '\n    /* Self build: APK uses the owner\'s signing key. */\n', text)
          if count != 1:
              raise SystemExit('Expected upstream signature check not found; review the current jni.c.')
          path.write_text(text)
          PY
          sed -i 's/\/\///g' settings.gradle

      - name: Native cache
        id: native-cache
        uses: actions/cache@v6
        with:
          path: TMessagesProj/src/main/libs
          key: self20-native-v1-${{ matrix.abi }}-${{ hashFiles('TMessagesProj/jni/**', 'bin/**', 'build.gradle', 'TMessagesProj/build.gradle', 'gradle/wrapper/**', '.gitmodules') }}

      - name: Initialize submodules
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Set up Java 17
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/27.2.12479018\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties

      - name: Compile native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          NATIVE_TARGET: ${{ matrix.abi }}
        run: |
          ./run init libs
          ./run libs native

      - name: Check native output
        env:
          NATIVE_TARGET: ${{ matrix.abi }}
        run: |
          test -n "$(find "TMessagesProj/src/main/libs/$NATIVE_TARGET" -name 'libtmessages*.so' -size +0c -print -quit)"

      - name: Upload native libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.abi }}
          path: TMessagesProj/src/main/libs
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build isolated API 896686 test APK
    needs: native
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: |
          sed -i 's/\/\///g' settings.gradle
          git submodule update --init --recursive

      - name: Verify 20-account source configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java')
          text = path.read_text()
          for name in ('MAX_ACCOUNT_DEFAULT_COUNT', 'MAX_ACCOUNT_PREMIUM_COUNT'):
              if not re.search(r'\b' + name + r'\s*=\s*20\s*;', text):
                  raise SystemExit(f'{name} must be 20 in UserConfig.java.')
          if not re.search(r'\bMAX_ACCOUNT_COUNT\s*=\s*128\s*;', text):
              raise SystemExit('Keep internal account slots at 128.')
          if 'ExtendedHelper.getInstance().hasExtended()' in text:
              raise SystemExit('Remove the extra account-slot bypass from requestAccountSlot().')
          print('Login limit: 20. Internal account slots remain 128.')
          PY

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          name: native-arm64-v8a
          path: TMessagesProj/src/main/libs


      - name: Prepare isolated API 896686 test app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          
          ROOT = Path('.')
          PACKAGE = 'com.king108star.accountapitest'
          APP_NAME = 'Account API Test'
          API_ID = '896686'
          API_HASH = 'cfa1494541244ed94cbb742712b0dc37'
          
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Unexpected source structure: ' + old[:80])
              return text.replace(old, new)
          
          gradle_path = ROOT / 'TMessagesProj/build.gradle'
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = replace_once(gradle, 'defaultConfig.applicationId = "xyz.nextalone.nagram"', f'defaultConfig.applicationId = "{PACKAGE}"')
          gradle = replace_once(gradle, 'def appId = "11535358"', f'def appId = "{API_ID}"')
          gradle = replace_once(gradle, 'def appHash = "33d372962fadb01df47e6ceed4e33cd6"', f'def appHash = "{API_HASH}"')
          gradle = replace_once(gradle, 'versionName verName', 'versionName verName + "-api896686-test"')
          gradle = replace_once(gradle, 'String gramName = "Nagram"', 'String gramName = "Account-API-Test"')
          gradle_path.write_text(gradle, encoding='utf-8')
          
          # Separate Android storage, providers, launcher identity, and Firebase resource selection.
          manifest_path = ROOT / 'TMessagesProj/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text(encoding='utf-8')
          assert '${applicationId}.provider' in manifest
          manifest, icon_count = re.subn(r'android:(icon|roundIcon)="@[^"]+"', r'android:\1="@drawable/ic_account_api_test"', manifest)
          if icon_count < 1:
              raise SystemExit('No launcher icon references found')
          manifest_path.write_text(manifest, encoding='utf-8')
          icon = ROOT / 'TMessagesProj/src/main/res/drawable/ic_account_api_test.xml'
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#186B55" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#FFFFFF" android:pathData="M22,24h8v60h-8zM22,24h25v8h-25zM22,50h25v8h-25zM39,24h8v60h-8zM57,24h29v8h-29zM67,24h9v60h-9z"/>
          </vector>''', encoding='utf-8')
          
          labels = 0
          for path in (ROOT / 'TMessagesProj/src/main/res').glob('values*/strings*.xml'):
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r'(<string\b[^>]*\bname="NekoX"[^>]*>).*?(</string>)', r'\g<1>' + APP_NAME + r'\g<2>', text, flags=re.S)
              if count:
                  path.write_text(text, encoding='utf-8')
                  labels += count
          if not labels:
              raise SystemExit('Application label resource not found')
          
          firebase_path = ROOT / 'TMessagesProj/google-services.json'
          firebase = json.loads(firebase_path.read_text(encoding='utf-8'))
          matches = [client for client in firebase['client'] if client['client_info']['android_client_info']['package_name'] == 'xyz.nextalone.nagram']
          if len(matches) != 1:
              raise SystemExit('Expected exactly one original Firebase client')
          test_client = json.loads(json.dumps(matches[0]))
          test_client['client_info']['android_client_info']['package_name'] = PACKAGE
          firebase['client'].append(test_client)
          firebase_path.write_text(json.dumps(firebase, indent=2), encoding='utf-8')
          
          # Read the current server authorization's API ID instead of assuming build defaults.
          session_path = ROOT / 'TMessagesProj/src/main/java/org/telegram/ui/SessionBottomSheet.java'
          session = session_path.read_text(encoding='utf-8')
          session = replace_once(session, 'stringBuilder.append(" ").append(session.app_version);', '''stringBuilder.append(" ").append(session.app_version);
                  if (isCurrentSession) {
                      stringBuilder.append("\\nSession API ID: ").append(session.api_id);
                  }''')
          session_path.write_text(session, encoding='utf-8')
          
          print('Test package:', PACKAGE)
          print('Default API ID:', API_ID)
          print('Fresh normal login required; current-session API ID is visible under Settings > Devices.')
          print('This isolated test does not register a new Firebase application; background push is not part of the join test.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/27.2.12479018\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties

      - name: Restore own signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path('TMessagesProj/release.keystore').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip(), validate=True))
          PY

      - name: Set build timestamp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import time
          path = Path('gradle.properties')
          path.write_text(path.read_text().replace('2000000000000', str(time.time_ns() // 1_000_000)))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile signed release APKs
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          ./gradlew TMessagesProj:testReleaseUnitTest --tests org.telegram.messenger.UserConfigAccountLimitTest --build-cache --no-configuration-cache
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache


      - name: Verify test package and generated API configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          configs = list(Path('TMessagesProj/build/generated').rglob('BuildConfig.java'))
          matched = [p for p in configs if 'package org.telegram.messenger;' in p.read_text() and 'APPLICATION_ID' in p.read_text()]
          if len(matched) != 1:
              raise SystemExit('Expected one release BuildConfig')
          text = matched[0].read_text()
          for pattern in (r'APP_ID\s*=\s*896686\s*;', r'APPLICATION_ID\s*=\s*"com.king108star.accountapitest"'):
              if not re.search(pattern, text):
                  raise SystemExit('Test BuildConfig verification failed')
          print('Verified isolated package and API 896686 in generated BuildConfig.')
          PY
          APK=$(find TMessagesProj/build/outputs/apk -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > test-apk-badging.txt
          head -n 4 test-apk-badging.txt
          grep -q "package: name='com.king108star.accountapitest'" test-apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

      - name: Upload APKs for download
        uses: actions/upload-artifact@v7
        with:
          name: Account-API896686-Test-arm64
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
